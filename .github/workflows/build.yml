
name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project ZIP
        run: |
          mkdir extracted
          unzip -o AndroidEmailReader-GitHubBuild.zip -d extracted
          find extracted -name settings.gradle.kts

      - name: Locate project
        run: |
          PROJECT=$(dirname "$(find extracted -name settings.gradle.kts | head -1)")
          echo "PROJECT=$PROJECT" >> $GITHUB_ENV
      
      - name: Build APK
        run: |
         cd "$PROJECT"
         gradle assembleDebug
    
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EmailReader-debug-apk
          path: extracted/**/app/build/outputs/apk/debug/*.apk
